<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kunskapsportal för TFF</title>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

  <div class="top">
    <h1>Kunskapsportal för TFF</h1>
    <input type="text" placeholder="Vad kan vi hjälpa dig med?" />
  </div>

  <div class="grid">

    <!-- ✅ Slott ersatt -->
    <div class="card">
      <img src="assets/img/hero-left.jpg" alt="">
      <p>Upptäck hur enkelt det kan vara</p>
    </div>

    <!-- ✅ Välkommen -->
    <div class="card">
      <h2>Välkommen till dina Digitala utbildningar</h2>
      <p>
        Här hittar du kommunens utbildningar, moduler och quiz.
        Följ kursstrukturen steg för steg och säkerställ att du
        arbetar enligt rätt arbetssätt i Microsoft 365.
      </p>
    </div>

    <!-- ✅ Fråga TFF -->
    <a href="https://m365.cloud.microsoft/chat" class="card" target="_blank">
      <img src="assets/img/tile-atlas.jpg" alt="">
      <h3>Fråga TFF</h3>
    </a>

    <!-- ✅ Digitala utbildningar -->
    <a href="utbildningar.html" class="card">
      <img src="assets/img/tile-edut.jpg" alt="">
      <h3>Digitala utbildningar</h3>
    </a>

  </div>

</body>
</html>
