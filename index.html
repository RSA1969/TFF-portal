<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFF – Portal</title>

<style>
body{margin:0;font-family:Arial;background:#f3f4f6}

/* HEADER */
.topbar{
background:#165c8d;
color:white;
padding:30px;
text-align:center;
}

.search input{
width:500px;
padding:12px;
border-radius:10px;
border:none;
}

/* GRID */
.container{max-width:1200px;margin:auto;padding:20px}

.grid{
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:15px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

.big img{height:420px}

.card-body{padding:10px;text-align:center}

/* BUTTONS */
.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.btn{
background:#165c8d;
color:white;
padding:20px;
text-align:center;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<h1>Kunskapsportal för TFF</h1>
<div class="search">
<input placeholder="Vad kan vi hjälpa dig med?"
onkeydown="if(event.key==='Enter') window.location.href='utbildningar.html'">
</div>
</div>

<div class="container">

<div class="grid">

<div class="card big" onclick="goCatalog()">
<img src="assets/img/hero-left.jpg">
<div class="card-body">
<h3>Upptäck hur enkelt det kan vara</h3>
</div>
</div>

<div class="card" onclick="goCatalog()">
<img src="assets/img/tile-guides.jpg">
<div class="card-body"><h3>Alla guider</h3></div>
</div>

<div class="card" onclick="goCourse('kurs04_ai')">
<img src="assets/img/tile-hrkollegan.jpg">
<div class="card-body"><h3>Fråga Vera</h3></div>
</div>

<div class="card" onclick="goCatalog()">
<img src="assets/img/tile-edu.jpg">
<div class="card-body"><h3>Digitala utbildningar</h3></div>
</div>

<div class="card" onclick="goCatalog('obligatorisk')">
<img src="assets/img/tile-mandatory.jpg">
<div class="card-body"><h3>Obligatoriska</h3></div>
</div>

<div class="card" onclick="goCatalog()">
<img src="assets/img/tile-chef.jpg">
<div class="card-body"><h3>Chef</h3></div>
</div>

<div class="card" onclick="goCourse('kurs10')">
<img src="assets/img/tile-status.jpg">
<div class="card-body"><h3>HR‑kollegan</h3></div>
</div>

</div>

<div class="buttons">
<div class="btn" onclick="goCourse('kurs06')">Heroma</div>
<div class="btn" onclick="goCatalog()">Kontakta HR</div>
</div>

</div>

<script>
function goCatalog(){
window.location.href="utbildningar.html";
}

function goCourse(id){
window.location.href="utbildning.html?course="+id;
}
</script>

</body>
</html>
