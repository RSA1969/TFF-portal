<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kunskapsportal för TFF</title>

  <!-- ✅ CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <div class="top">
    <h1>Kunskapsportal för TFF</h1>
    <input type="text" placeholder="Vad kan vi hjälpa dig med?" />
  </div>

  <!-- ✅ GRID -->
  <div class="grid">

    <!-- ✅ VÄNSTER STOR (slott) -->
    <div class="left-large">
      <img src="assets/img/hero-left.jpg" alt="Slott">
    </div>

    <!-- ✅ HÖGER -->
    <div class="right-side">

      <!-- TOP ROW -->
      <div class="top-row">

        <!-- Fråga TFF -->
        <a class="card" href="https://m365.cloud.microsoft/chat" target="_blank">
          <img src="assets/img/tile-atlas.jpg" alt="Fråga TFF">
          <h3>Fråga TFF</h3>
        </a>

        <!-- TFF Digitala Utbildningar -->
        <a class="card" href="utbildningar.html">
          <img src="assets/img/tile-edut.jpg" alt="TFF Digitala utbildningar">
          <h3>TFF Digitala Utbildningar</h3>
        </a>

      </div>

      <!-- ✅ UNDER -->
      <div class="bottom-row">
        <a class="card" href="utbildningar.html">
          <img src="assets/img/tile-guides.jpg" alt="Utbildningar">
          <h3>Utbildningar</h3>
        </a>
      </div>

    </div>

  </div>

</body>
</html>
