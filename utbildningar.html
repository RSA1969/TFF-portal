<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Utbildningar</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

h1, h2 {
    margin: 20px;
}

#courseGrid, #modules, #questions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

button {
    margin-top: 10px;
    padding: 10px;
    width: 100%;
    border: none;
    border-radius: 6px;
    background: #0078d4;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #005ea6;
}

video {
    width: 90%;
    margin: 20px;
    border-radius: 10px;
}
</style>

</head>

<body>

<div id="courses"></div>

<!-- ✅ VIKTIGT: rätt sökväg -->
<script src="./assets/js/kurser-app.js"></script>

</body>
</html>
