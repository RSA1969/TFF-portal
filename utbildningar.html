<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kurskatalog</title>

<style>
body{font-family:Arial;background:#f3f4f6;margin:0}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
cursor:pointer;
border-left:6px solid #ccc;
}

.badge{
background:#eee;
padding:4px 8px;
border-radius:10px;
font-size:12px;
}
</style>
</head>

<body>

<h1 style="padding:20px">Kurser</h1>

<div class="grid" id="courses"></div>

<script>

const kurser = [];

for(let i=1;i<=15;i++){
kurser.push({
id:"kurs"+i,
name:"Kurs "+i,
desc:"Beskrivning kurs "+i
});
}

const container=document.getElementById("courses");

kurser.forEach(k=>{
let div=document.createElement("div");
div.className="card";
div.onclick=()=>location.href="utbildning.html?course="+k.id;

div.innerHTML=`
<h3>${k.name}</h3>
<p>${k.desc}</p>
<span class="badge">5 moduler</span>
`;

container.appendChild(div);
});

</script>

</body>
</html>
