<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kurser</title>
</head>
<body>

<h1>Kurser</h1>
<div id="lista"></div>

<script>
fetch("assets/data/kurser-data.json")
.then(r => r.json())
.then(data => {
    const lista = document.getElementById("lista");

    data.kurser.forEach(kurs => {
        const div = document.createElement("div");

        div.innerHTML = `
            <h3>${kurs.titel}</h3>
            <p>${kurs.beskrivning}</p>
            <a href="kurs_dokumentation.html?id=${kurs.id}">Öppna kurs</a>
        `;

        lista.appendChild(div);
    });
});
</script>

</body>
</html>
