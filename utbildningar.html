<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFF Utbildningsportal</title>

  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="assets/js/kurser-data.js"></script>

  <style>
    body { margin:0; font-family:"Segoe UI", Arial; background:#f5f7fa; }
    header { background:#0b1635; color:#fff; padding:28px 20px; }
    header h1 { margin:0; font-size:2rem; }

    .container { max-width:1280px; margin:auto; padding:28px; }

    .topbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; }

    .search {
      padding:12px;
      border-radius:10px;
      border:1px solid #d0d5dd;
      width:320px;
    }

    .grid {
      margin-top:20px;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:20px;
    }

    .card {
      background:#fff;
      border:1px solid #ddd;
      border-radius:14px;
      padding:18px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
    }

    .card:hover {
      box-shadow:0 8px 20px rgba(0,0,0,0.1);
    }

    .start-btn {
      margin-top:auto;
      background:#124078;
      color:#fff;
      border:none;
      padding:10px;
      border-radius:8px;
      cursor:pointer;
    }

    .status { margin-top:20px; color:#667085; }
  </style>
</head>

<body>

<header>
  <h1>TFF Utbildningsportal</h1>
</header>

<main class="container">

<div class="topbar">
  <div>
    <a href="index.html">← Tillbaka till startsidan</a>
    <h2>Välj utbildning</h2>
  </div>

  <input id="searchInput" class="search" placeholder="Sök kurs..." />
</div>

<div id="status" class="status"></div>
<div id="grid" class="grid"></div>

</main>

<script>
let allCourses = [];

/* ========= LOAD DATA (ROBUST VERSION) ========= */
function loadCourses(){

  console.log("Start loading courses");

  if (window.kursData && Array.isArray(window.kursData)) {
    allCourses = window.kursData;
  }
  else if (window.kurserData && Array.isArray(window.kurserData)) {
    allCourses = window.kurserData;
  }
  else if (window.KURS_DATA && Array.isArray(window.KURS_DATA)) {
    allCourses = window.KURS_DATA;
  }
  else if (window.kurser && Array.isArray(window.kurser)) {
    allCourses = window.kurser;
  }
  else {
    console.error("Ingen kursdata hittad i JS");
    allCourses = [];
  }

  render(allCourses);
}

/* ========= RENDER ========= */
function render(data){

  document.getElementById("status").textContent =
    data.length + " kurser hittades";

  document.getElementById("grid").innerHTML =
    data.map((c,i)=>`
      <div class="card" data-index="${i}">
        <h3>Kurs ${i+1} – ${c.titel || c.title}</h3>
        <p>${c.beskrivning || c.description || ""}</p>
        <span>${(c.moduler || []).length} moduler</span>

        <button class="start-btn" data-index="${i}">
          Starta kurs
        </button>
      </div>
    `).join("");

  bindEvents();
}

/* ========= EVENTS ========= */
function bindEvents(){

  document.querySelectorAll(".card").forEach(card=>{
    card.onclick = (e)=>{
      if(e.target.classList.contains("start-btn")) return;
      openCourse(card.dataset.index);
    };
  });

  document.querySelectorAll(".start-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      openCourse(btn.dataset.index);
    };
  });
}

/* ========= OPEN COURSE ========= */
function openCourse(i){
  const course = allCourses[i];
  if(!course) return;

  localStorage.setItem("selectedCourse", JSON.stringify(course));
  localStorage.setItem("courseIndex", i);

  window.location.href = "kurser.html";
}

/* ========= SEARCH ========= */
document.getElementById("searchInput").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase();

  const filtered = allCourses.filter(c =>
    (c.titel || "").toLowerCase().includes(q) ||
    (c.beskrivning || "").toLowerCase().includes(q)
  );

  render(filtered);
});

/* START */
loadCourses();

</script>

</body>
</html>
