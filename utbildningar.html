| `kursData is not defined` | JavaScript-filen laddades aldrig, därför finns ingen variabel |

I repo-trädet syns att du har **`assets/data/kurser-data.json`** och **`assets/js/kurser-data.js`** — men **inte** `assets/data/kurser-data.js`. [1](https://github.com/RSA1969/TFF-portal/blob/main/kurser.html)

## Gör så här
**Ersätt hela `utbildningar.html` med koden nedan.**  
Denna version:
- läser först `assets/data/kurser-data.json`
- fallbackar till `assets/js/kurser-data.js`
- klarar flera olika JSON/JS-strukturer
- sparar vald kurs så `kurser.html` kan öppna rätt kurs

<body>

  <header>
    <h1>TFF Utbildningsportal</h1>
  </header>

  <main class="container">
    <div class="toprow">
      <h2>Välj utbildning</h2>
      <div class="searchbox">
        <input id="searchInput" type="search" placeholder="Sök kurs..." />
      </div>
    </div>

    <div id="status" class="status">Läser in kurser…</div>
    <div id="content" class="loading">Läser in data…</div>
  </main>

  <script>
    const JSON_PATH = "assets/data/kurser-data.json";
    let ALL_COURSES = [];

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function norm(text) {
      return String(text ?? "").trim().toLowerCase();
    }

    function slugify(text) {
      return String(text ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[–—]/g, "-")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function pickArray(data) {
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.kurser)) return data.kurser;
      if (data && Array.isArray(data.courses)) return data.courses;
      if (data && Array.isArray(data.items)) return data.items;
      if (data && Array.isArray(data.data)) return data.data;
      return [];
    }

    function getGlobalCourseData() {
      if (Array.isArray(window.kursData)) return window.kursData;
      if (Array.isArray(window.kurserData)) return window.kurserData;
      if (Array.isArray(window.KURS_DATA)) return window.KURS_DATA;
      if (Array.isArray(window.kurser)) return window.kurser;

      if (window.kursData && Array.isArray(window.kursData.kurser)) return window.kursData.kurser;
      if (window.kurserData && Array.isArray(window.kurserData.kurser)) return window.kurserData.kurser;
      if (window.KURS_DATA && Array.isArray(window.KURS_DATA.kurser)) return window.KURS_DATA.kurser;

      return [];
    }

    function normalizeCourses(raw) {
      const courses = pickArray(raw);

      return courses.map((course, index) => {
        const title =
          course.titel ||
          course.title ||
          course.namn ||
          course.name ||
          course.kurs ||
          `Kurs ${index + 1}`;

        const description =
          course.beskrivning ||
          course.description ||
          course.syfte ||
          course.intro ||
          "";

        const rawModules =
          course.moduler ||
          course.modules ||
          course.innehall ||
          course.innehåll ||
          [];

        const modules = pickArray(rawModules).length
          ? pickArray(rawModules)
          : Array.isArray(rawModules) ? rawModules : [];

        return {
          id: slugify(course.id || title || `kurs-${index + 1}`),
          title,
          description,
          moduleCount: modules.length || 0,
          raw: course
        };
      });
    }

    async function loadCourses() {
      try {
        const response = await fetch(JSON_PATH, { cache: "no-store" });

        if (response.ok) {
          const json = await response.json();
          const normalized = normalizeCourses(json);
          if (normalized.length) return normalized;
        }
      } catch (_) {}

      const fallback = normalizeCourses(getGlobalCourseData());
      if (fallback.length) return fallback;

      throw new Error(
        "Ingen läsbar kursdata hittades. Kontrollera assets/data/kurser-data.json eller assets/js/kurser-data.js."
      );
    }

    function renderCourses(courses) {
      const content = document.getElementById("content");
      const status = document.getElementById("status");

      if (!courses.length) {
        status.textContent = "0 kurser hittades";
        content.className = "empty";
        content.innerHTML = "Ingen kursdata kunde visas.";
        return;
      }

      status.textContent = `${courses.length} kurser hittades`;

      content.className = "";
      content.innerHTML = `
        <div class="grid">
          ${courses.map((course, index) => `
            <article class="card" data-index="${index}">
              <div class="card-title">${esc(course.title)}</div>
              <div class="card-desc">${esc(course.description || "Ingen beskrivning tillgänglig.")}</div>
              <div class="card-meta">
                <span class="badge">${course.moduleCount} moduler</span>
                <button class="start-btn" type="button">Starta kurs</button>
              </div>
            </article>
          `).join("")}
        </div>
      `;

      content.querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => {
          const index = Number(card.dataset.index);
          const selected = courses[index];

          localStorage.setItem("selectedCourseIndex", String(index));
          localStorage.setItem("selectedCourse", String(index));
          localStorage.setItem("selectedCourseId", selected.id);
          localStorage.setItem("selectedCourseTitle", selected.title);

          window.location.href = "kurser.html";
        });
      });
    }

    function filterAndRender() {
      const q = norm(document.getElementById("searchInput").value);
      if (!q) {
        renderCourses(ALL_COURSES);
        return;
      }

      const filtered = ALL_COURSES.filter(course =>
        norm(course.title).includes(q) ||
        norm(course.description).includes(q)
      );

      renderCourses(filtered);
    }

    async function init() {
      const content = document.getElementById("content");

      try {
        ALL_COURSES = await loadCourses();
        renderCourses(ALL_COURSES);

        document.getElementById("searchInput").addEventListener("input", filterAndRender);
      } catch (error) {
        document.getElementById("status").textContent = "Fel vid inläsning";
        content.className = "error";
        content.innerHTML = `
          <strong>Kunde inte läsa kursdata.</strong>
          <pre>${esc(error.message)}</pre>
        `;
      }
    }

    init();
  </script>
</body>
