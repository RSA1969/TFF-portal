<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFF Utbildningsportal</title>
  <style>
    :root{
      --bg:#eef2f6;
      --panel:#ffffff;
      --text:#132238;
      --muted:#5f6b7a;
      --line:#cfd7e3;
      --primary:#114a8b;
      --primary-dark:#0c3a6c;
      --soft:#eff5ff;
      --soft-line:#cfe0ff;
      --radius:14px;
      --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      font-family:"Segoe UI", Arial, sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 18px 28px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:24px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .left-tools{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .back-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--soft-line);
      background:var(--soft);
      color:var(--primary);
      text-decoration:none;
      font-weight:600;
      width:max-content;
    }

    .back-btn:hover{
      background:#e7f0ff;
    }

    h1{
      margin:0 0 8px 0;
      font-size:1.95rem;
      line-height:1.2;
      color:#0f1f35;
    }

    .sub{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      max-width:70ch;
    }

    .search-wrap{
      min-width:340px;
      flex:0 0 340px;
    }

    .search{
      width:100%;
      height:50px;
      padding:0 16px;
      border-radius:12px;
      border:1px solid #cfd7e3;
      background:#fff;
      color:var(--text);
      font-size:1rem;
      outline:none;
    }

    .search:focus{
      border-color:#9bb8e5;
      box-shadow:0 0 0 4px rgba(17,74,139,.08);
    }

    h2{
      margin:8px 0 8px 0;
      font-size:1.55rem;
      line-height:1.2;
      color:#10243d;
    }

    .count{
      margin:0 0 16px 0;
      color:var(--muted);
      font-size:1rem;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap:16px;
    }

    .card{
      min-height:210px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:var(--shadow);
      padding:18px 16px 16px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:0 12px;
      border-radius:999px;
      background:var(--soft);
      color:var(--primary);
      border:1px solid var(--soft-line);
      font-size:.82rem;
      font-weight:700;
      width:max-content;
      margin-bottom:14px;
    }

    .card-title{
      margin:0 0 10px 0;
      font-size:1.02rem;
      line-height:1.45;
      font-weight:800;
      text-transform:none;
      color:#0f2138;
    }

    .card-desc{
      margin:0;
      color:#586577;
      line-height:1.65;
      font-size:.98rem;
      min-height:72px;
    }

    .card-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:20px;
    }

    .meta{
      color:#586577;
      font-size:.95rem;
    }

    .start-btn{
      border:none;
      border-radius:10px;
      background:var(--primary);
      color:#fff;
      padding:11px 16px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    .start-btn:hover{
      background:var(--primary-dark);
    }

    .empty{
      display:none;
      padding:28px;
      border:1px dashed var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--muted);
      text-align:center;
    }

    @media (max-width:900px){
      .search-wrap{
        min-width:100%;
        flex:1 1 100%;
      }

      .grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="left-tools">
        <a class="back-btn" href="index.html">← Tillbaka till startsidan</a>

        <div>
          <h2>Välj utbildning</h2>
          <p class="count" id="courseCount">16 kurser hittades</p>
        </div>
      </div>

      <div class="search-wrap">
        <input
          id="courseSearch"
          class="search"
          type="search"
          placeholder="Sök kurs..."
          aria-label="Sök kurs"
        />
      </div>
    </div>

    <div id="courseGrid" class="grid"></div>
    <div id="emptyState" class="empty">Inga kurser matchar sökningen.</div>
  </div>

  <script>
    const COURSES = [
      {
        id: 1,
        label: "Kurs 1",
        title: "Kurs 1 – MICROSOFT TEAMS",
        description: "Rätt användning av Teams i vardagsarbetet.",
        modules: 5
      },
      {
        id: 2,
        label: "Kurs 2",
        title: "Kurs 2 – TRANSKRIBERING",
        description: "Effektiv och spårbar omvandling av tal till text.",
        modules: 5
      },
      {
        id: 3,
        label: "Kurs 3",
        title: "Kurs 3 – DOKUMENTATION",
        description: "Strukturerad dokumentation enligt regelverk.",
        modules: 5
      },
      {
        id: 4,
        label: "Kurs 4",
        title: "Kurs 4 – AI & COPILOT",
        description: "Grunderna i AI och Copilot i arbetet.",
        modules: 5
      },
      {
        id: 5,
        label: "Kurs 5",
        title: "Kurs 5 – PROMPTNING",
        description: "Skriva effektiva prompts i Microsoft 365.",
        modules: 5
      },
      {
        id: 6,
        label: "Kurs 6",
        title: "Kurs 6 – SKAPA OCH SPARA DOKUMENT",
        description: "Korrekt dokumenthantering i vardagen.",
        modules: 5
      },
      {
        id: 7,
        label: "Kurs 7",
        title: "Kurs 7 – TEAMS & SHAREPOINT",
        description: "Rätt struktur, lagring och behörigheter.",
        modules: 5
      },
      {
        id: 8,
        label: "Kurs 8",
        title: "Kurs 8 – GDPR",
        description: "Rätt hantering av information och personuppgifter.",
        modules: 5
      },
      {
        id: 9,
        label: "Kurs 9",
        title: "Kurs 9 – RÄTT VERKTYG",
        description: "Välja rätt verktyg för rätt arbete.",
        modules: 5
      },
      {
        id: 10,
        label: "Kurs 10",
        title: "Kurs 10 – MÖTESKULTUR",
        description: "Effektiva digitala möten med tydliga resultat.",
        modules: 5
      },
      {
        id: 11,
        label: "Kurs 11",
        title: "Kurs 11 – FRÅN CHATT TILL STRUKTUR",
        description: "Göra kunskap beständig och återanvändbar.",
        modules: 5
      },
      {
        id: 12,
        label: "Kurs 12",
        title: "Kurs 12 – DIARIEFÖRING",
        description: "Korrekt hantering av allmänna handlingar och dokument.",
        modules: 5
      },
      {
        id: 13,
        label: "Kurs 13",
        title: "Kurs 13 – GOVERNANCE",
        description: "Styrning, struktur och uppföljning i M365.",
        modules: 5
      },
      {
        id: 14,
        label: "Kurs 14",
        title: "Kurs 14 – LIVSCYKEL",
        description: "Informationshantering genom hela livscykeln.",
        modules: 5
      },
      {
        id: 15,
        label: "Kurs 15",
        title: "Kurs 15 – PROCESSARBETE",
        description: "Processbaserat arbetssätt i digital miljö.",
        modules: 5
      },
      {
        id: 16,
        label: "Kurs 16",
        title: "Kurs 16 – ARBETA EFFEKTIVT MED DIN PERSONLIGA COPILOT",
        description: "En praktisk kurs om hur du använder din personliga Copilot i vardagen för att arbeta mer strukturerat, professionellt och effektivt.",
        modules: 5
      }
    ];

    function renderCourses(list) {
      const grid = document.getElementById("courseGrid");
      const count = document.getElementById("courseCount");
      const empty = document.getElementById("emptyState");

      grid.innerHTML = "";
      count.textContent = `${list.length} kurser hittades`;

      if (!list.length) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      list.forEach(course => {
        const card = document.createElement("article");
        card.className = "card";

        card.innerHTML = `
          <div>
            <div class="tag">${course.label}</div>
            <h3 class="card-title">${course.title}</h3>
            <p class="card-desc">${course.description}</p>
          </div>
          <div class="card-footer">
            <div class="meta">${course.modules} moduler</div>
            <button class="start-btn" type="button" data-course-id="${course.id}">Starta kurs</button>
          </div>
        `;

        grid.appendChild(card);
      });

      grid.querySelectorAll(".start-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-course-id");
          localStorage.setItem("tff_selected_course_id", `kurs-${id}`);
          window.location.href = `kurser.html?course=kurs-${id}`;
        });
      });
    }

    function filterCourses(value) {
      const q = String(value || "").trim().toLowerCase();

      if (!q) {
        renderCourses(COURSES);
        return;
      }

      const filtered = COURSES.filter(course => {
        return course.title.toLowerCase().includes(q) ||
               course.description.toLowerCase().includes(q) ||
               course.label.toLowerCase().includes(q);
      });

      renderCourses(filtered);
    }

    document.getElementById("courseSearch").addEventListener("input", e => {
      filterCourses(e.target.value);
    });

    renderCourses(COURSES);
  </script>
</body>
</html>
