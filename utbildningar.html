<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Moduler</title>
</head>
<body>

<h1>Moduler</h1>

<div id="modules"></div>

<script src="assets/js/kurser-data.js"></script>

<script>
const courseId = localStorage.getItem("selectedCourse") || "kurs1";

const course = kurserData.find(c => c.id === courseId);
const container = document.getElementById("modules");

if (!course) {
  container.innerHTML = "<p>Ingen kurs hittades</p>";
} else {
  course.modules.forEach(m => {
    const div = document.createElement("div");

    div.innerHTML = `
      <h3>${m.title}</h3>
      <button onclick="startModule('${m.id}')">Starta</button>
    `;

    container.appendChild(div);
  });
}

function startModule(id) {
  localStorage.setItem("selectedModule", id);
  window.location.href = "quiz.html";
}
</script>

</body>
</html>
