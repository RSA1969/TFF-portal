<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Moduler</title>
</head>
<body>

<h1>Moduler</h1>

<div id="modules"></div>

<script src="assets/js/kurser-data.js"></script>

<script>
const courseId = localStorage.getItem("selectedCourse");
const course = kurserData.find(c => c.id === courseId);

const container = document.getElementById("modules");

course.modules.forEach(module => {
  const div = document.createElement("div");

  div.innerHTML = `
    <h3>${module.title}</h3>
    <button onclick="playModule('${module.id}')">Starta</button>
  `;

  container.appendChild(div);
});

function playModule(moduleId) {
  localStorage.setItem("selectedModule", moduleId);
  window.location.href = "quiz.html";
}
</script>

</body>
</html>
