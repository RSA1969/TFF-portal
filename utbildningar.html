<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Utbildningar</title>

<style>
body {
    font-family: Arial;
    background:#f3f4f6;
    margin:0;
    padding:20px;
}

h1 { text-align:center; }

/* SÖK */
.search {
    max-width:600px;
    margin:20px auto;
}
.search input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}

/* FILTER */
.filter {
    margin:20px 0;
}
.filter button {
    margin:5px;
    padding:8px 12px;
    border-radius:20px;
    border:1px solid #ccc;
    background:white;
}

/* STATUS */
.status-box {
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}
.röd { border-top:6px solid #d32f2f; }
.orange { border-top:6px solid #f57c00; }
.grön { border-top:6px solid #2e7d32; }

/* GRID */
.grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

/* CARD */
.card {
    border-radius:12px;
    padding:15px;
    cursor:pointer;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* FÄRGER PER KURS */
.k1 { background:#e3f2fd; }
.k2 { background:#e0f2f1; }
.k3 { background:#fff3e0; }
.k4 { background:#e8f5e9; }
.k5 { background:#fce4ec; }
.k6 { background:#ede7f6; }
.k7 { background:#f3e5f5; }
.k8 { background:#f1f8e9; }
.k9 { background:#e8eaf6; }
.k10 { background:#fff8e1; }
.k11 { background:#e0f7fa; }
.k12 { background:#f9fbe7; }
.k13 { background:#efebe9; }
.k14 { background:#fbe9e7; }
.k15 { background:#eceff1; }

.tag {
    display:inline-block;
    padding:4px 10px;
    background:white;
    border-radius:15px;
    font-size:12px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>Utbildningar</h1>

<div class="search">
<input type="text" placeholder="Sök utbildning...">
</div>

<div class="filter">
<button>Grundutbildning</button>
<button>Fördjupning</button>
<button>System</button>
<button>AI och Copilot</button>
<button>Obligatorisk</button>
</div>

<div class="status-box röd">
<b>Ej påbörjade kurser</b><br>
Dokumentation • Informationshantering • GDPR & NIS2
</div>

<div class="status-box orange">
<b>Påbörjade kurser</b><br>
SharePoint struktur • Behörigheter
</div>

<div class="status-box grön">
<b>Godkända kurser</b><br>
Intro Microsoft 365
</div>

<h2>Kurser</h2>

<div class="grid" id="kurser"></div>

<script>

const kurser = [
{ id:"1", css:"k1", namn:"Kurs 1 – MICROSOFT TEAMS: GRUND & ARBETSSÄTT", syfte:"Rätt användning av Teams i vardagsarbetet" },
{ id:"2", css:"k2", namn:"Kurs 2 – TRANSKRIBERING", syfte:"Omvandla tal till text" },
{ id:"3", css:"k3", namn:"Kurs 3 – DOKUMENTATION (TFF)", syfte:"Säker dokumentation" },
{ id:"4", css:"k4", namn:"Kurs 4 – AI & COPILOT", syfte:"Grundförståelse AI" },
{ id:"5", css:"k5", namn:"Kurs 5 – PROMPTNING I COPILOT", syfte:"Skriva effektiva prompts" },
{ id:"6", css:"k6", namn:"Kurs 6 – SKAPA & SPARA DOKUMENT", syfte:"Arbeta korrekt i dokument" },
{ id:"7", css:"k7", namn:"Kurs 7 – TEAMS & SHAREPOINT", syfte:"Behörigheter och struktur" },
{ id:"8", css:"k8", namn:"Kurs 8 – GDPR & INFOKLASSNING", syfte:"Rätt information" },
{ id:"9", css:"k9", namn:"Kurs 9 – RÄTT VERKTYG", syfte:"Välj rätt system" },
{ id:"10", css:"k10", namn:"Kurs 10 – MÖTESKULTUR", syfte:"Effektiva möten" },
{ id:"11", css:"k11", namn:"Kurs 11 – FRÅN CHATT TILL STRUKTUR", syfte:"Skapa ordning" },
{ id:"12", css:"k12", namn:"Kurs 12 – DIARIEFÖRING", syfte:"Arkivering korrekt" },
{ id:"13", css:"k13", namn:"Kurs 13 – STYRNING", syfte:"Governance i M365" },
{ id:"14", css:"k14", namn:"Kurs 14 – INFORMATIONSHANTERING", syfte:"Struktur och kontroll" },
{ id:"15", css:"k15", namn:"Kurs 15 – PROCESSARBETE", syfte:"Arbeta processbaserat" }
];

const container = document.getElementById("kurser");

kurser.forEach(kurs => {
    const div = document.createElement("div");
    div.className = "card " + kurs.css;

    div.onclick = () => {
        window.location.href = "kurs_dokumentation.html";
    };

    div.innerHTML = `
        <h3>${kurs.namn}</h3>
        <p>Syfte: ${kurs.syfte}</p>
        <div class="tag">5 moduler</div>
    `;

    container.appendChild(div);
});

</script>

</body>
</html>
