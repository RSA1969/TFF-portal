<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utbildningar</title>

<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/kurser-data.js"></script>

<style>
body {
    font-family: "Segoe UI", Arial;
    background: #f4f6f8;
    margin: 0;
    padding: 30px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.course-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    text-decoration: none;
    color: black;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.course-card h3 {
    margin: 0 0 10px 0;
}

.badge {
    margin-top: 10px;
    display: inline-block;
    padding: 6px 12px;
    background: #eef;
    border-radius: 20px;
    font-size: 12px;
}
</style>
</head>

<body>

<h1>Alla utbildningar</h1>

<div id="courseContainer" class="grid"></div>

<script>
document.getElementById("courseContainer").innerHTML = courses.map(course => `
<a href="kurs.html?course=${course.id}" class="course-card" style="border-left:6px solid ${course.color}">
    <h3>${course.title}</h3>
    <p>Syfte: ${course.purpose}</p>
    <div class="badge">5 moduler</div>
</a>
`).join("");
</script>

</body>
</html>
