<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFF – Kurskatalog</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#14532d;
      --primary2:#2563eb;
      --shadow:0 6px 18px rgba(0,0,0,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Segoe UI, Arial, sans-serif;
      color:var(--text);
      background:var(--bg);
    }
    .container{
      max-width:1200px;
      margin:0 auto;
      padding:24px;
    }
    .hero{
      background:#fff;
      border-radius:var(--radius);
      padding:28px;
      box-shadow:var(--shadow);
      margin-bottom:24px;
    }
    h1{margin:0 0 8px;font-size:2rem}
    p{margin:0;color:var(--muted);line-height:1.6}
    .toolbar{
      display:flex;
      justify-content:flex-end;
      margin:16px 0 24px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 16px;
      border-radius:12px;
      border:none;
      cursor:pointer;
      font-weight:600;
      text-decoration:none;
    }
    .btn-outline{
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:18px;
    }
    .course-card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .course-card__body{
      padding:20px;
    }
    .course-code{
      display:inline-block;
      background:#eef2ff;
      color:#4338ca;
      font-weight:700;
      font-size:.85rem;
      padding:6px 10px;
      border-radius:999px;
      margin-bottom:12px;
    }
    .course-card h3{
      margin:0 0 8px;
      font-size:1.15rem;
    }
    .course-card p{
      margin:0 0 10px;
      min-height:48px;
    }
    .progress-bar{
      width:100%;
      height:10px;
      background:#edf2f7;
      border-radius:999px;
      overflow:hidden;
      margin:10px 0 8px;
    }
    .progress-bar span{
      display:block;
      height:100%;
      background:#10b981;
    }
    .progress-text{
      font-size:.93rem;
      color:var(--muted);
    }
    .btn-primary{
      background:var(--primary2);
      color:#fff;
      width:100%;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>TFF – Kurskatalog</h1>
      <p>Digitala kurser med moduler, video, quiz och progression.</p>
    </section>

    <div class="toolbar">
      <button class="btn btn-outline" onclick="resetAllProgress()">Rensa progression</button>
    </div>

    <section id="coursesGrid" class="grid"></section>
  </main>

  <script src="kurser-app.js"></script>
</body>
</html>
