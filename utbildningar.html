<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFF Utbildningsportal</title>

<link rel="stylesheet" href="assets/css/styles.css">

<style>
body {
    margin:0;
    font-family: "Segoe UI", Arial;
    background:#f5f7fa;
}

header {
    background:#0f172a;
    color:white;
    padding:20px;
}

.container {
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.card {
    background:white;
    border-radius:12px;
    padding:20px;
    border:1px solid #ddd;
    cursor:pointer;
}

.card:hover {
    transform:translateY(-3px);
}

.title {
    font-weight:bold;
    margin-bottom:10px;
}

.desc {
    color:#555;
}
</style>

</head>

<body>

<header>
    <h1>TFF Utbildningsportal</h1>
</header>

<div class="container">
    <h2>Välj utbildning</h2>
    <div id="courseGrid" class="grid"></div>
</div>

<script src="assets/data/kurser-data.js"></script>

<script>

const grid = document.getElementById("courseGrid");

// använder din befintliga data från kurser-data.js
kursData.forEach((kurs, index) => {

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <div class="title">${kurs.titel}</div>
        <div class="desc">${kurs.beskrivning || ""}</div>
    `;

    card.onclick = () => {
        localStorage.setItem("selectedCourse", index);
        window.location.href = "kurser.html";
    };

    grid.appendChild(card);

});

</script>

</body>
</html>
