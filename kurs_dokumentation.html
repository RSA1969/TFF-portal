<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurs</title>

  <style>
    body {
      margin: 0;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #0f172a;
    }

    .wrap {
      max-width: 1260px;
      margin: 0 auto;
      padding: 48px 32px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .topbar h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .topbar p {
      margin: 0;
      font-size: 16px;
      line-height: 1.5;
    }

    .back-btn {
      padding: 8px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .module-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border-left: 8px solid #8cc9bd;
      box-sizing: border-box;
    }

    .module-card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .module-card p {
      margin: 0 0 14px;
      line-height: 1.5;
      font-size: 15px;
    }

    .module-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #0f172a;
      background: #ffffff;
      color: #0f172a;
      font-size: 14px;
      font-weight: 700;
    }

    .empty {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 id="kursTitel">Kurs</h1>
        <p id="kursBeskrivning">Laddar kursinformation...</p>
      </div>
      <div>
        <button class="back-btn" type="button" onclick="window.location.href='utbildningar.html'">Tillbaka</button>
      </div>
    </div>

    <div id="modulContainer"></div>
  </div>

  <script>
    const kurs = JSON.parse(localStorage.getItem("selectedKurs") || "null");

    const kursTitelEl = document.getElementById("kursTitel");
    const kursBeskrivningEl = document.getElementById("kursBeskrivning");
    const modulContainer = document.getElementById("modulContainer");

    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function render() {
      if (!kurs) {
        kursTitelEl.textContent = "Ingen kurs vald";
        kursBeskrivningEl.textContent = "Det finns ingen vald kurs i localStorage.";
        modulContainer.innerHTML = '<div class="empty">Öppna en kurs från kurslistan först.</div>';
        return;
      }

      kursTitelEl.textContent = kurs.titel || "Kurs";
      kursBeskrivningEl.textContent = kurs.beskrivning || "";

      const borderColor = kurs.color || "#8cc9bd";

      if (!Array.isArray(kurs.moduler) || !kurs.moduler.length) {
        modulContainer.innerHTML = '<div class="empty">Den här kursen saknar moduler.</div>';
        return;
      }

      const sorteradeModuler = [...kurs.moduler].sort((a, b) => {
        return (a.modulNummer || 0) - (b.modulNummer || 0);
      });

      modulContainer.innerHTML = sorteradeModuler.map(modul => `
        <div class="module-card" style="border-left-color:${borderColor}">
          <h2>Modul ${escapeHtml(modul.modulNummer)} – ${escapeHtml(modul.titel)}</h2>
          <p>${escapeHtml(modul.innehall || "Ingen beskrivning finns angiven i Excel.")}</p>
          <div class="module-actions">
            ${
              modul.videoUrl
                ? `<a class="btn" href="${escapeHtml(modul.videoUrl)}" target="_blank" rel="noopener noreferrer">Öppna MP4</a>`
                : `<span class="btn">Ingen MP4-länk</span>`
            }
          </div>
        </div>
      `).join("");
    }

    render();
  </script>
</body>
</html>
