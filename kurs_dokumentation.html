<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kurs</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<h1 id="titel"></h1>
<p id="beskrivning"></p>

<h2>Moduler</h2>
<div id="moduler"></div>

<h2>Video</h2>
<video id="video" controls width="600"></video>

<script>

const params = new URLSearchParams(window.location.search);
const kursId = params.get("id");

fetch("assets/data/kurser-data.json?nocache=1")
.then(r => r.json())
.then(data => {

    const kurs = data.kurser.find(k => k.id === kursId);

    document.getElementById("titel").innerText = kurs.titel;
    document.getElementById("beskrivning").innerText = kurs.beskrivning;

    const modDiv = document.getElementById("moduler");

    // 🔴 KRITISK FIX
    kurs.moduler.forEach((m, i) => {

        const btn = document.createElement("button");

        btn.innerText = m.titel;

        btn.onclick = () => {

            // 🔴 VIKTIGT: korrekt koppling VIDEO
            const video = kurs.videor[m.videoIndex];

            if(video && video.url){
                document.getElementById("video").src = video.url;
            }
        };

        modDiv.appendChild(btn);
    });

});
</script>

</body>
</html>
