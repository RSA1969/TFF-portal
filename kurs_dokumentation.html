<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Kurs</title>
</head>
<body>

    <h1 id="kursTitel"></h1>
    <p id="kursBeskrivning"></p>

    <script>
        // Hämta kursId från URL
        const params = new URLSearchParams(window.location.search);
        const kursId = params.get("id");

        console.log("KursId:", kursId);

        // Testdata (ersätt senare med SharePoint/Excel)
        const kurser = [
            {
                id: "kurs1",
                titel: "Kurs 1 – Microsoft Teams",
                beskrivning: "Rätt användning av Teams i vardagsarbetet",
                moduler: ["Modul 1", "Modul 2", "Modul 3"]
            }
        ];

        // Hitta kurs
        const kurs = kurser.find(k => k.id === kursId);

        console.log("Kurs:", kurs);

        // Kontroll så att kurs finns
        if (kurs) {
            document.getElementById("kursTitel").innerText = kurs.titel;
            document.getElementById("kursBeskrivning").innerText = kurs.beskrivning;
        } else {
            document.getElementById("kursTitel").innerText = "Kurs hittades inte";
        }
    </script>

</body>
</html>
