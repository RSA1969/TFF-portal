<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Kurs</title>
</head>
<body>

    <h1 id="kursTitel"></h1>
    <p id="kursBeskrivning"></p>

    <div id="videoContainer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const params = new URLSearchParams(window.location.search);
            const kursId = params.get("id");

            fetch("assets/data/kurser-data.json")
                .then(response => response.json())
                .then(data => {

                    const kurs = data.kurser.find(k => k.id === kursId);

                    if (kurs) {

                        document.getElementById("kursTitel").innerText = kurs.titel;
                        document.getElementById("kursBeskrivning").innerText = kurs.beskrivning;

                        const videoContainer = document.getElementById("videoContainer");
                        videoContainer.innerHTML = "";

                        kurs.videor.forEach(video => {
                            const videoElement = document.createElement("video");
                            videoElement.controls = true;
                            videoElement.width = 600;

                            const source = document.createElement("source");
                            source.src = video.url;
                            source.type = "video/mp4";

                            videoElement.appendChild(source);
                            videoContainer.appendChild(videoElement);
                        });

                    } else {
                        document.getElementById("kursTitel").innerText = "Kurs hittades inte";
                    }

                })
                .catch(error => {
                    console.error("Fel:", error);
                    document.getElementById("kursTitel").innerText = "Fel vid laddning";
                });

        });
    </script>

</body>
</html>
