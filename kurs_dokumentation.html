<script>

const kurs = JSON.parse(localStorage.getItem("selectedKurs"));

console.log("Kurs:", kurs);

const titel = document.getElementById("titel");
const beskrivning = document.getElementById("beskrivning");
const container = document.getElementById("moduler");

// Säkerhet
if (!kurs) {
    document.body.innerHTML = "<p>Ingen kurs vald</p>";
}

// Skriv ut kursinfo
titel.innerText = kurs.titel;
beskrivning.innerText = kurs.beskrivning;

// ✅ KRITISK FIX
const moduler = kurs.moduler || [];

if (moduler.length === 0) {
    container.innerHTML = "<p>Inga moduler hittades</p>";
} else {

    moduler.forEach(m => {

        const div = document.createElement("div");

        div.innerHTML = `
            <h3>Modul ${m.modulNummer} – ${m.titel}</h3>
            <p>${m.innehall}</p>
            ${
                m.videoUrl
                ? `<a href="${m.videoUrl}" target="_blank">Öppna MP4</a>`
                : `<p>Ingen video</p>`
            }
        `;

        container.appendChild(div);
    });
}

</script>
