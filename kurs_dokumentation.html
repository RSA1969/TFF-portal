<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Kurs</title>

<style>
body { font-family: Arial; margin: 40px; }
.modul { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }
</style>

</head>
<body>

<h1 id="titel"></h1>
<p id="beskrivning"></p>

<div id="moduler"></div>

<script>

const kurs = JSON.parse(localStorage.getItem("selectedKurs"));

document.getElementById("titel").innerText = kurs.titel;
document.getElementById("beskrivning").innerText = kurs.beskrivning;

const container = document.getElementById("moduler");

kurs.moduler.forEach(m => {

    const div = document.createElement("div");
    div.className = "modul";

    div.innerHTML = `
        <h3>Modul ${m.modulNummer} – ${m.titel}</h3>
        <p>${m.innehall}</p>
        ${
            m.videoUrl
            ? `<a href="${m.videoUrl}" target="_blank">Öppna MP4</a>`
            : `<p>Ingen video</p>`
        }
    `;

    container.appendChild(div);
});

</script>

</body>
</html>
``
