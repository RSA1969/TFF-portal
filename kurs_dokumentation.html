<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Kurs</title>

<link rel="stylesheet" href="assets/css/styles.css">

<style>
.container {
  display: flex;
  gap: 20px;
}

.sidebar {
  width: 300px;
}

.content {
  flex: 1;
}

button {
  display: block;
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  text-align: left;
  border-radius: 8px;
  border: 1px solid #ccc;
  cursor: pointer;
  background: #f5f5f5;
}
button:hover {
  background: #e6f0ff;
}

ul {
  margin-top: 10px;
}
</style>

</head>

<body>

<h1 id="kursTitel"></h1>
<p id="kursText"></p>

<div class="container">

  <div class="sidebar">
    <h2>Moduler</h2>
    <div id="moduler"></div>
  </div>

  <div class="content">
    <h2 id="modulTitel"></h2>
    <p id="modulSyfte"></p>

    <h3>Innehåll</h3>
    <ul id="modulInnehall"></ul>

    <h3>Video</h3>
    <video id="video" controls width="600"></video>
  </div>

</div>

<script src="assets/js/kurs_dokumentation.js"></script>

</body>
</html>
