<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFF Utbildningsportal – Kurser</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f7fa;
}

.page {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: 100vh;
}

.sidebar {
  background:#0f172a;
  color:white;
  padding:20px;
}

.course-btn {
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border:none;
  border-radius:8px;
  text-align:left;
  cursor:pointer;
}

.course-btn.active {
  background:white;
  color:black;
}

.main {
  padding:20px;
}
</style>
</head>

<body>

<div class="page">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>TFF portal</h2>

<div class="sidebar-tools">

<input id="courseSearch" placeholder="Sök kurs..." style="width:100%;padding:8px">

<button onclick="resetProgress()">Nollställ progression</button>

<button onclick="logout()">Logga ut</button>

<br><br>

<!-- ✅ FIXAD LÄNK -->
<a href="index.html" style="color:white;">Till startsidan</a><br>
<a href="utbildningar.html" style="color:white;">Till utbildningssidan</a>

</div>

<div id="courseList"></div>

</div>

<!-- MAIN -->
<div class="main">

<h2 id="courseTitle"></h2>

<div id="modules"></div>

</div>

</div>

<script>

const SELECT_KEY = "tff_selected_course_id";

/* ✅ ALLA 16 KURSER */
const COURSES = [
{ id:"kurs-1", name:"Kurs 1 – Microsoft Teams" },
{ id:"kurs-2", name:"Kurs 2 – Transkribering" },
{ id:"kurs-3", name:"Kurs 3 – Dokumentation" },
{ id:"kurs-4", name:"Kurs 4 – AI & Copilot" },
{ id:"kurs-5", name:"Kurs 5 – Promptning" },
{ id:"kurs-6", name:"Kurs 6 – Dokument" },
{ id:"kurs-7", name:"Kurs 7 – Teams & SharePoint" },
{ id:"kurs-8", name:"Kurs 8 – GDPR" },
{ id:"kurs-9", name:"Kurs 9 – Rätt verktyg" },
{ id:"kurs-10", name:"Kurs 10 – Möteskultur" },
{ id:"kurs-11", name:"Kurs 11 – Struktur" },
{ id:"kurs-12", name:"Kurs 12 – Diarieföring" },
{ id:"kurs-13", name:"Kurs 13 – Governance" },
{ id:"kurs-14", name:"Kurs 14 – Livscykel" },
{ id:"kurs-15", name:"Kurs 15 – Processarbete" },

/* ✅ KURS 16 */
{ id:"kurs-16", name:"Kurs 16 – Arbeta effektivt med din Copilot" }

];

/* ✅ QUERY STÖD */
function getCourseFromURL(){
  const p = new URLSearchParams(window.location.search);
  const c = p.get("course");
  return c;
}

let selected = getCourseFromURL() || localStorage.getItem(SELECT_KEY) || "kurs-1";

function renderCourses(){
  const list = document.getElementById("courseList");
  list.innerHTML="";

  COURSES.forEach(c=>{
    const btn = document.createElement("button");
    btn.className="course-btn"+(c.id===selected?" active":"");
    btn.innerText=c.name;

    btn.onclick=()=>{
      selected=c.id;
      localStorage.setItem(SELECT_KEY,c.id);
      renderAll();
    };

    list.appendChild(btn);
  });
}

function renderCourse(){
  const course = COURSES.find(c=>c.id===selected);
  document.getElementById("courseTitle").innerText = course.name;

  const modules = document.getElementById("modules");
  modules.innerHTML="";

  for(let i=1;i<=5;i++){
    const div=document.createElement("div");
    div.innerText="Modul "+i;
    modules.appendChild(div);
  }
}

function renderAll(){
  renderCourses();
  renderCourse();
}

/* STUBS */
function resetProgress(){localStorage.clear(); location.reload();}
function logout(){alert("logout dummy");}

/* INIT */
renderAll();

</script>

</body>
</html>
