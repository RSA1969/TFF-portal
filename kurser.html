<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurs</title>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

<main>

  <!-- ✅ MODUL -->
  <section>
    <h1 id="module-title"></h1>
    <p id="module-purpose"></p>
  </section>

  <!-- ✅ VIDEO -->
  <section>
    <video id="module-video" controls width="100%"></video>
  </section>

  <!-- ✅ QUIZ -->
  <section>
    <h2>Quiz</h2>
    <div id="quiz-container"></div>
  </section>

</main>

<!-- ✅ DATA -->
<script src="assets/js/kurser-data.js"></script>

<!-- ✅ LOGIK -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(window.location.search);
  const rawCourseId = params.get("course");
  const rawModuleId = params.get("module");

  const titleEl = document.getElementById("module-title");
  const purposeEl = document.getElementById("module-purpose");
  const videoEl = document.getElementById("module-video");
  const container = document.getElementById("quiz-container");

  if (!titleEl || !purposeEl || !videoEl || !container) {
    console.error("HTML-element saknas");
    return;
  }

  // ✅ ID FIX
  function mapCourse(id) {
    const m = id && id.match(/kurs(\d+)/);
    return m ? "kurs" + parseInt(m[1], 10) : null;
  }

  function mapModule(id) {
    const m = id && id.match(/kurs(\d+)_modul(\d+)/);
    return m ? "k" + parseInt(m[1], 10) + "m" + parseInt(m[2], 10) : null;
  }

  const courseId = mapCourse(rawCourseId);
  const moduleId = mapModule(rawModuleId);

  if (!courseId || !moduleId) {
    container.innerHTML = "<p>Felaktiga parametrar</p>";
    return;
  }

  const course = kurserData.find(c => c.id === courseId);
  if (!course) {
    container.innerHTML = "<p>Kurs hittas inte</p>";
    return;
  }

  const module = course.modules.find(m => m.id === moduleId);
  if (!module) {
    container.innerHTML = "<p>Modul hittas inte</p>";
    return;
  }

  // ✅ MODULDATA
  titleEl.textContent = module.title;
  purposeEl.textContent = module.purpose;

  if (module.video) {
    videoEl.src = module.video;
  }

  // ✅ QUIZ
  const quiz = module.questions;
  let answers = new Array(quiz.length).fill(null);

  quiz.forEach((q, index) => {

    const div = document.createElement("div");

    const title = document.createElement("h4");
    title.textContent = (index + 1) + ". " + q.q;
    div.appendChild(title);

    q.options.forEach((opt, i) => {

      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opt;
      btn.style.display = "block";
      btn.style.margin = "5px 0";

      btn.onclick = () => {

        // ✅ redan svarat → stoppa
        if (answers[index] !== null) return;

        answers[index] = i;

        const buttons = div.querySelectorAll("button");

        buttons.forEach((b, idx) => {

          if (idx === q.correct) {
            b.style.background = "green"; // ✅ rätt
          } 
          else if (idx === i) {
            b.style.background = "red";   // ❌ fel
          }

          b.disabled = true; // ✅ lås
        });
      };

      div.appendChild(btn);
    });

    container.appendChild(div);
  });

  // ✅ SUBMIT
  const submitBtn = document.createElement("button");
  submitBtn.textContent = "Godkänn quiz";
  submitBtn.style.marginTop = "20px";

  submitBtn.onclick = () => {

    let score = 0;

    quiz.forEach((q, i) => {
      if (answers[i] === q.correct) score++;
    });

    alert("Resultat: " + score + " / " + quiz.length);
  };

  container.appendChild(submitBtn);

});
</script>

</body>
</html>
