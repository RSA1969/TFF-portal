<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Kurser</title>
</head>
<body>

<h1>Kurser</h1>

<div id="courses"></div>

<script src="assets/js/kurser-data.js"></script>

<script>
function loadCourses() {
  const container = document.getElementById("courses");

  if (!window.kurserData) {
    container.innerHTML = "<p>Ingen data laddad</p>";
    return;
  }

  kurserData.forEach(course => {
    const div = document.createElement("div");

    div.innerHTML = `
      <h2>${course.title}</h2>
      <button onclick="openCourse('${course.id}')">Öppna</button>
    `;

    container.appendChild(div);
  });
}

function openCourse(id) {
  localStorage.setItem("selectedCourse", id);
  window.location.href = "utbildningar.html";
}

loadCourses();
</script>

</body>
</html>
