<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFF Portal – Kurs</title>

assets/css/styles.css

<style>
body { margin:0; font-family: Segoe UI, Arial; }
.container { max-width:1200px; margin:auto; padding:20px; }

.module {
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

.video-box {
    background:#f3f3f3;
    padding:10px;
    border-radius:10px;
    margin-top:15px;
}

video { width:100%; border-radius:10px; }

.quiz { margin-top:20px; }

.quiz-question {
    margin-bottom:15px;
    padding:10px;
    border:1px solid #eee;
    border-radius:8px;
}
</style>

</head>
<body>

<div id="app" class="container"></div>

<script>
// ==========================
// PARAMS
// ==========================
const params = new URLSearchParams(window.location.search);
const courseId = params.get("course");
const moduleId = params.get("module");

// ==========================
// DATA (DU BYTER SENARE TILL JSON)
// ==========================
const data = {
    kurs01: {
        title: "Microsoft Teams – Grund",
        modules: {
            kurs01_modul01: {
                title: "Vad är Teams",

                // ✅ BYT denna till riktig MP4
                video: "https://rsa1969.github.io/TFF-portal/assets/video/demo.mp4",

                quiz: [
                    {
                        q: "Vad är huvudsyftet?",
                        a: [
                            "Lagra lokalt",
                            "Rätt användning i vardagen",
                            "Undvika samarbete",
                            "Ersätta dokument"
                        ],
                        correct: 1
                    },
                    {
                        q: "Vad stödjer bästa arbetssätt?",
                        a: [
                            "E-post",
                            "Teams kanaler",
                            "USB-minne",
                            "Utskrifter"
                        ],
                        correct: 1
                    }
                ]
            }
        }
    }
};

// ==========================
// VIDEO FIX (SharePoint)
// ==========================
function getVideoUrl(url) {
    if (!url) return "";

    if (url.includes("sharepoint.com")) {
        if (url.includes("?")) return url + "&download=1";
        return url + "?download=1";
    }

    return url;
}

// ==========================
// RENDER
// ==========================
function render() {
    const root = document.getElementById("app");

    const kurs = data[courseId];
    if (!kurs) {
        root.innerHTML = "<h2>Kurs saknas</h2>";
        return;
    }

    const modul = kurs.modules[moduleId];
    if (!modul) {
        root.innerHTML = "<h2>Modul saknas</h2>";
        return;
    }

    const videoUrl = getVideoUrl(modul.video);

    root.innerHTML = `
        <h1>${kurs.title}</h1>

        <div class="module">
            <h2>${modul.title}</h2>

            <div class="video-box">
                ${videoUrl ? `
                <video controls preload="metadata">
                    <source src="${videoUrl}" type="video/mp4">
                </video>
                ` : `<p>Ingen video</p>`}
            </div>

            <div class="quiz">
                <h3>Quiz</h3>
                ${modul.quiz.map((q, i) => `
                    <div class="quiz-question">
                        <strong>Fråga ${i+1}: ${q.q}</strong>
                        ${q.a.map((alt, j) => `
                            <div>
                                <input type="radio" name="q${i}" value="${j}">
                                ${alt}
                            </div>
                        `).join("")}
                    </div>
                `).join("")}
            </div>
        </div>
    `;
}

render();
</script>

</body>
</html>
