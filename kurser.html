<script src="assets/js/kurser-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(window.location.search);
  const courseId = params.get("course");   // t.ex. kurs01
  const moduleId = params.get("module");   // t.ex. kurs01_modul01

  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  // ✅ Hitta kurs (DU HAR ARRAY → måste loopa)
  const course = kurserData.find(c => c.id === courseId);

  if (!course) {
    container.innerHTML = "<p>Kurs hittas inte</p>";
    return;
  }

  // ✅ Hitta modul (DITT ID = k1m1 osv)
  const module = course.modules.find(m => {

    // Anpassning: URL = kurs01_modul01 → din data = k1m1
    return moduleId.includes(m.id);

  });

  if (!module || !module.questions) {
    container.innerHTML = "<p>Ingen quiz hittades</p>";
    return;
  }

  const quiz = module.questions;

  let answers = new Array(quiz.length).fill(null);

  quiz.forEach((q, index) => {

    const div = document.createElement("div");

    const title = document.createElement("h4");
    title.textContent = (index + 1) + ". " + q.q;

    div.appendChild(title);

    q.options.forEach((opt, i) => {

      const btn = document.createElement("button");
      btn.textContent = opt;
      btn.style.display = "block";
      btn.style.margin = "5px 0";

      btn.onclick = () => {

        answers[index] = i;

        const all = div.querySelectorAll("button");
        all.forEach(b => b.style.background = "");

        btn.style.background = "#d0e6ff";
      };

      div.appendChild(btn);
    });

    container.appendChild(div);
  });

  const submitBtn = document.createElement("button");
  submitBtn.textContent = "Godkänn quiz";
  submitBtn.style.marginTop = "20px";

  submitBtn.onclick = () => {

    let score = 0;

    quiz.forEach((q, i) => {
      if (answers[i] === q.correct) score++;
    });

    alert("Resultat: " + score + " / " + quiz.length);
  };

  container.appendChild(submitBtn);

});
</script>
