<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurser</title>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <main>

    <section class="quiz-section">
      <h2>Quiz</h2>

      <!-- ✅ KRITISK RAD -->
      <div id="quiz-container"></div>

    </section>

  </main>

  <!-- ✅ DATA (MÅSTE LADDAS FÖRST) -->
  <script src="assets/js/kurser-data.js"></script>

  <!-- ✅ QUIZ LOGIK -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);
    const rawCourseId = params.get("course");   // kurs01
    const rawModuleId = params.get("module");   // kurs01_modul01

    const container = document.getElementById("quiz-container");

    if (!container) {
      console.error("quiz-container saknas");
      return;
    }

    container.innerHTML = "";

    // ✅ ID-MAPPING
    function mapCourse(id) {
      const match = id && id.match(/kurs(\d+)/);
      return match ? "kurs" + parseInt(match[1], 10) : null;
    }

    function mapModule(id) {
      const match = id && id.match(/kurs(\d+)_modul(\d+)/);
      return match ? "k" + parseInt(match[1], 10) + "m" + parseInt(match[2], 10) : null;
    }

    const courseId = mapCourse(rawCourseId);
    const moduleId = mapModule(rawModuleId);

    if (!courseId || !moduleId) {
      container.innerHTML = "<p>Felaktiga parametrar i URL</p>";
      return;
    }

    // ✅ Hitta kurs
    const course = kurserData.find(c => c.id === courseId);

    if (!course) {
      container.innerHTML = "<p>Kurs hittas inte</p>";
      return;
    }

    // ✅ Hitta modul
    const module = course.modules.find(m => m.id === moduleId);

    if (!module || !module.questions) {
      container.innerHTML = "<p>Ingen quiz hittades</p>";
      return;
    }

    const quiz = module.questions;
    let answers = new Array(quiz.length).fill(null);

    // ✅ Render quiz
    quiz.forEach((q, index) => {

      const div = document.createElement("div");

      const title = document.createElement("h4");
      title.textContent = (index + 1) + ". " + q.q;
      div.appendChild(title);

      q.options.forEach((opt, i) => {

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = opt;
        btn.style.display = "block";
        btn.style.margin = "5px 0";

        btn.onclick = () => {

          answers[index] = i;

          const all = div.querySelectorAll("button");
          all.forEach(b => b.style.background = "");

          btn.style.background = "#d0e6ff";
        };

        div.appendChild(btn);
      });

      container.appendChild(div);
    });

    // ✅ Godkänn
    const submitBtn = document.createElement("button");
    submitBtn.textContent = "Godkänn quiz";
    submitBtn.style.marginTop = "20px";

    submitBtn.onclick = () => {

      let score = 0;

      quiz.forEach((q, i) => {
        if (answers[i] === q.correct) score++;
      });

      alert("Resultat: " + score + " / " + quiz.length);
    };

    container.appendChild(submitBtn);

  });
  </script>

</body>
</html>
