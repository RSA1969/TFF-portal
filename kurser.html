<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs</title>

<script src="assets/js/kurser-data.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f4f6f8;}

.container { display:flex; padding:20px; }

.sidebar { width:300px; }

.module {
    background:white;
    margin:10px 0;
    padding:10px;
    cursor:pointer;
    border-radius:8px;
}

.module.active {
    border-left:5px solid var(--color);
}

.main { flex:1; padding-left:20px;}

.quiz-btn {
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:var(--color);
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<div class="sidebar">
<h3>Moduler</h3>
<div id="modules"></div>
</div>

<div class="main">
<h2 id="title"></h2>

<h3 id="moduleTitle"></h3>

<p id="content"></p>

<a id="quizBtn" class="quiz-btn">Starta Quiz</a>

</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("course");

// fallback så sidan inte blir tom
const course = courses.find(c => c.id == id) || courses[0];

document.documentElement.style.setProperty("--color", course.color);

document.getElementById("title").innerText = course.title;

// skapa moduler
document.getElementById("modules").innerHTML =
course.modules.map(m => `
<div class="module" data-id="${m.id}">
${m.title}
</div>
`).join("");

// klickfunktion för moduler
document.querySelectorAll(".module").forEach(el => {
  el.onclick = () => loadModule(el.dataset.id, el);
});

function loadModule(id, el){

const m = course.modules.find(x => x.id == id);

document.getElementById("moduleTitle").innerText = m.title;
document.getElementById("content").innerText = m.content.join(", ");

document.getElementById("quizBtn").href =
`quiz.html?course=${course.id}&module=${m.id}`;

// mark active
document.querySelectorAll(".module").forEach(e=>e.classList.remove("active"));
el.classList.add("active");
}

// AUTO start första modul → detta var problemet hos dig
loadModule(course.modules[0].id, document.querySelector(".module"));
</script>

</body>
</html>
