<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurs</title>

<link rel="stylesheet" href="assets/css/styles.css">
<script src="assets/js/kurser-data.js"></script>

<style>
body { font-family: Arial; margin:0; background:#f4f6f8;}

.container { display:flex; padding:20px; }

.sidebar { width:300px; }

.module {
    background:white;
    margin:10px 0;
    padding:10px;
    cursor:pointer;
    border-radius:8px;
}

.module.active {
    border-left:5px solid var(--color);
}

.main { flex:1; padding-left:20px;}

button {
    padding:10px;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="container">

<div class="sidebar">
<h3>Moduler</h3>
<div id="modules"></div>
</div>

<div class="main">
<h2 id="title"></h2>

<p id="moduleTitle"></p>

<p id="content"></p>

<a id="quizBtn">
<button>Starta Quiz</button>
</a>

</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("course");

const course = courses.find(c => c.id == id)

if(!course){
document.body.innerHTML = "Ingen kurs vald"
}

document.documentElement.style.setProperty("--color", course.color)

document.getElementById("title").innerText = course.title

document.getElementById("modules").innerHTML =
course.modules.map(m => `
<div class="module" onclick="loadModule(${m.id}, this)">
${m.title}
</div>
`).join("")

function loadModule(id, el){

const m = course.modules.find(x => x.id == id)

document.getElementById("moduleTitle").innerText = m.title
document.getElementById("content").innerText = m.content.join(", ")

document.getElementById("quizBtn").href =
`quiz.html?course=${course.id}&module=${m.id}`

// mark active
document.querySelectorAll(".module").forEach(e=>e.classList.remove("active"))
el.classList.add("active")
}

// load first module automatically
loadModule(1, document.querySelector(".module"))
</script>

</body>
</html>
