<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurs</title>

  <link rel="stylesheet" href="assets/css/styles.css">

  <style>
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    button {
      padding: 10px;
      width: 100%;
      text-align: left;
    }

    section {
      margin-bottom: 30px;
    }
  </style>

</head>

<body>

<main>

  <section>
    <h1 id="module-title"></h1>
    <p id="module-purpose"></p>
  </section>

  <section>
    <video id="module-video" controls width="100%"></video>
  </section>

  <section>
    <h2>Quiz</h2>
    <div id="quiz-container"></div>
  </section>

</main>

<script src="assets/js/kurser-data.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(window.location.search);
  const rawCourseId = params.get("course");
  const rawModuleId = params.get("module");

  const titleEl = document.getElementById("module-title");
  const purposeEl = document.getElementById("module-purpose");
  const videoEl = document.getElementById("module-video");
  const container = document.getElementById("quiz-container");

  function mapCourse(id) {
    const m = id && id.match(/kurs(\d+)/);
    return m ? "kurs" + parseInt(m[1], 10) : null;
  }

  function mapModule(id) {
    const m = id && id.match(/kurs(\d+)_modul(\d+)/);
    return m ? "k" + parseInt(m[1], 10) + "m" + parseInt(m[2], 10) : null;
  }

  const courseId = mapCourse(rawCourseId);
  const moduleId = mapModule(rawModuleId);

  const course = kurserData.find(c => c.id === courseId);
  const module = course?.modules.find(m => m.id === moduleId);

  if (!module) {
    container.innerHTML = "<p>Ingen modul hittades</p>";
    return;
  }

  titleEl.textContent = module.title;
  purposeEl.textContent = module.purpose;
  if (module.video) videoEl.src = module.video;

  const quiz = module.questions;
  let answers = new Array(quiz.length).fill(null);

  quiz.forEach((q, index) => {

    const div = document.createElement("div");

    const title = document.createElement("h4");
    title.textContent = (index + 1) + ". " + q.q;
    div.appendChild(title);

    const buttons = [];

    q.options.forEach((opt, i) => {

      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = opt;

      btn.onclick = () => {

        if (answers[index] === q.correct) return;

        buttons.forEach(b => {
          b.style.background = "";
        });

        answers[index] = i;

        if (i === q.correct) {
          btn.style.background = "green";
          buttons.forEach(b => b.disabled = true);
        } else {
          btn.style.background = "red";
        }
      };

      buttons.push(btn);
      div.appendChild(btn);
    });

    container.appendChild(div);
  });

  const submitBtn = document.createElement("button");
  submitBtn.textContent = "Godkänn quiz";

  submitBtn.onclick = () => {

    let score = 0;

    quiz.forEach((q, i) => {
      if (answers[i] === q.correct) score++;
    });

    // ✅ FIXAD RAD (detta var felet)
    alert("Resultat: " + score + " / " + quiz.length);
  };

  container.appendChild(submitBtn);

});
</script>

</body>
</html>
