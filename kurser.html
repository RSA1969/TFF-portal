<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<style>
body { font-family: Arial; background:#f4f6f8; }
.container { display:flex; padding:20px; }
.sidebar { width:300px; }

.module {
    background:white;
    margin:10px 0;
    padding:10px;
    cursor:pointer;
}

.module.active {
    border-left:5px solid var(--color);
}

.main { flex:1; padding-left:20px;}

.quiz-btn {
    display:inline-block;
    margin-top:20px;
    padding:10px;
    background:var(--color);
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
<h3>Moduler</h3>
<div id="modules"></div>
</div>

<div class="main">
<h2 id="title"></h2>
<h3 id="moduleTitle"></h3>
<p id="content"></p>

<a id="quizBtn" class="quiz-btn">Starta Quiz</a>

</div>

</div>

<script>
const p = new URLSearchParams(window.location.search);
const course = courses[0]; // TEST – tvingar visning

document.documentElement.style.setProperty("--color", course.color);

document.getElementById("title").innerText = course.title;

document.getElementById("modules").innerHTML =
course.modules.map(m=>`
<div class="module" onclick="loadModule(${m.id}, this)">
${m.title}
</div>
`).join("");

function loadModule(id, el){

const m = course.modules.find(x=>x.id==id);

document.getElementById("moduleTitle").innerText = m.title;
document.getElementById("content").innerText = m.content.join(" | ");

document.getElementById("quizBtn").href =
`quiz.html?course=${course.id}&module=${m.id}`;

document.querySelectorAll(".module").forEach(e=>e.classList.remove("active"));
el.classList.add("active");
}

// auto load
loadModule(1, document.querySelector(".module"));
</script>

</body>
</html>
