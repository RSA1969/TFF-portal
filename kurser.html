<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>TFF Kurser</title>
<style>
body {font-family: Arial; margin:0; background:#f4f4f4;}
.container {max-width:1000px; margin:auto; padding:20px;}
.card {background:#fff; padding:20px; margin-bottom:20px; border-radius:8px;}
button {padding:10px; margin:5px;}
iframe {width:100%; height:400px;}
.hidden {display:none;}
</style>
</head>

<body>
<div class="container">

<h1>TFF Kurser</h1>

<div id="course"></div>
<div id="module"></div>
<div id="video"></div>
<div id="quiz"></div>

</div>

<script>

// DATA (15 kurser, 5 moduler, 10 frågor)
const data = [];

for (let c = 1; c <= 15; c++) {
    const course = {
        name: "Kurs " + c,
        modules: []
    };

    for (let m = 1; m <= 5; m++) {
        const module = {
            name: "Modul " + m,
            video: "https://halmstad-my.sharepoint.com/", // byt till riktiga länkar
            questions: []
        };

        for (let q = 1; q <= 10; q++) {
            module.questions.push({
                q: "Fråga " + q + " (K" + c + " M" + m + ")",
                options: ["Alternativ 1", "Alternativ 2", "Alternativ 3", "Alternativ 4"],
                correct: Math.floor(Math.random()*4)
            });
        }

        course.modules.push(module);
    }

    data.push(course);
}

// STATE
let currentCourse = null;
let currentModule = null;
let currentQuestion = 0;

// VISA KURSER
function showCourses() {
    let html = "<h2>Välj kurs</h2>";
    data.forEach((c,i)=>{
        html += `<button onclick="selectCourse(${i})">${c.name}</button>`;
    });
    document.getElementById("course").innerHTML = html;
}
showCourses();

// VÄLJ KURS
function selectCourse(i){
    currentCourse = data[i];
    currentModule = null;

    let html = `<h2>${currentCourse.name}</h2>`;
    currentCourse.modules.forEach((m,i)=>{
        html += `<button onclick="selectModule(${i})">${m.name}</button>`;
    });

    document.getElementById("module").innerHTML = html;
    document.getElementById("video").innerHTML = "";
    document.getElementById("quiz").innerHTML = "";
}

// VÄLJ MODUL
function selectModule(i){
    currentModule = currentCourse.modules[i];
    currentQuestion = 0;

    document.getElementById("video").innerHTML =
        `<iframe src="${currentModule.video}"></iframe>
        <button onclick="startQuiz()">Starta frågor</button>`;
}

// START QUIZ
function startQuiz(){
    showQuestion();
}

// VISA FRÅGA
function showQuestion(){
    let q = currentModule.questions[currentQuestion];

    let html = `<h3>${q.q}</h3>`;
    q.options.forEach((opt,i)=>{
        html += `<button onclick="answer(${i})">${opt}</button>`;
    });

    document.getElementById("quiz").innerHTML = html;
}

// SVAR
function answer(i){
    let correct = currentModule.questions[currentQuestion].correct;

    if(i === correct){
        currentQuestion++;

        if(currentQuestion < currentModule.questions.length){
            showQuestion();
        } else {
            document.getElementById("quiz").innerHTML = "<h3>Klart</h3>";
        }
    } else {
        alert("Fel svar, försök igen");
    }
}

</script>

</body>
</html>
