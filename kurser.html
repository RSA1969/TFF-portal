<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFF Utbildningsportal – Kurser</title>

<style>
body{margin:0;font-family:Arial;background:#f5f7fa;}
.page{display:grid;grid-template-columns:300px 1fr;height:100vh;}
.sidebar{background:#0f172a;color:white;padding:20px;}
.main{padding:20px;}

.course-btn{
  width:100%;padding:12px;margin-bottom:8px;border:none;
  border-radius:8px;text-align:left;cursor:pointer;
}

.course-btn.active{background:white;color:black;}

a{color:white;text-decoration:none}
</style>
</head>

<body>

<div class="page">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>TFF portal</h2>

<input id="search" placeholder="Sök..." style="width:100%;padding:8px;margin-bottom:10px">

<br>

<!-- ✅ FIXADE LÄNKAR -->
<a href="index.html">Till startsidan</a><br><br>
<a href="utbildningar.html">Till utbildningssidan</a><br><br>

<div id="courseList"></div>

</div>

<!-- MAIN -->
<div class="main">

<h2 id="courseTitle"></h2>
<div id="modules"></div>

</div>

</div>

<script>

/* ✅ ALL DATA */
const courses = [
{ id:"kurs-1", title:"Kurs 1 – MICROSOFT TEAMS" },
{ id:"kurs-2", title:"Kurs 2 – TRANSKRIBERING" },
{ id:"kurs-3", title:"Kurs 3 – DOKUMENTATION" },
{ id:"kurs-4", title:"Kurs 4 – AI & COPILOT" },
{ id:"kurs-5", title:"Kurs 5 – PROMPTNING" },
{ id:"kurs-6", title:"Kurs 6 – SKAPA DOKUMENT" },
{ id:"kurs-7", title:"Kurs 7 – TEAMS & SHAREPOINT" },
{ id:"kurs-8", title:"Kurs 8 – GDPR" },
{ id:"kurs-9", title:"Kurs 9 – RÄTT VERKTYG" },
{ id:"kurs-10", title:"Kurs 10 – MÖTESKULTUR" },
{ id:"kurs-11", title:"Kurs 11 – STRUKTUR" },
{ id:"kurs-12", title:"Kurs 12 – DIARIEFÖRING" },
{ id:"kurs-13", title:"Kurs 13 – GOVERNANCE" },
{ id:"kurs-14", title:"Kurs 14 – LIVSCYKEL" },
{ id:"kurs-15", title:"Kurs 15 – PROCESSARBETE" },

/* ✅ KURS 16 */
{ id:"kurs-16", title:"Kurs 16 – ARBETA EFFEKTIVT MED DIN PERSONLIGA COPILOT" }
];

/* ✅ HÄMTA RÄTT KURS */
function getCourse() {
  const url = new URLSearchParams(window.location.search).get("course");
  const saved = localStorage.getItem("tff_selected_course_id");

  return url || saved || "kurs-1";
}

let selected = getCourse();

/* ✅ SIDOMENY */
function renderCourses() {
  const list = document.getElementById("courseList");
  list.innerHTML="";

  courses.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "course-btn"+(c.id===selected?" active":"");
    btn.textContent = c.title;

    btn.onclick = ()=>{
      selected = c.id;
      localStorage.setItem("tff_selected_course_id", c.id);
      renderAll();
    };

    list.appendChild(btn);
  });
}

/* ✅ VISA KURS */
function renderCourse() {
  const course = courses.find(c=>c.id===selected);

  document.getElementById("courseTitle").textContent = course.title;

  const modules = document.getElementById("modules");
  modules.innerHTML="";

  for(let i=1;i<=5;i++){
    const div = document.createElement("div");
    div.textContent = "Modul "+i;
    modules.appendChild(div);
  }
}

/* ✅ START */
function renderAll(){
  renderCourses();
  renderCourse();
}

renderAll();

</script>

</body>
</html>
