<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurser – TFF portal</title>
<link rel="stylesheet" href="assets/css/styles.css">

<style>
.container { max-width: 1100px; margin: auto; }

.module {
    border: 1px solid #ccc;
    padding: 16px;
    margin-bottom: 20px;
    background: #fff;
}

.hidden { display: none; }

.quiz-option {
    display: block;
    margin: 6px 0;
    padding: 8px;
    background: #f3f3f3;
    cursor: pointer;
}

.correct { background-color: #4CAF50; color: white; }
.wrong { background-color: #f44336; color: white; }

button {
    margin-top: 10px;
    padding: 10px 15px;
}
</style>

</head>

<body>

<header>
    <h1>Kurser</h1>
</header>

<main class="container">

    <!-- MODUL 1 -->
    <div class="module" id="module1">

        <h2>Modul 1 – Introduktion</h2>

        <video width="100%" controls>
            <source src="video/modul1.mp4" type="video/mp4">
        </video>

        <p>Grundläggande introduktion.</p>

        <div class="quiz" data-module="1">
            <p>Fråga: Vad är rätt?</p>

            <div class="quiz-option" data-correct="false">Svar A</div>
            <div class="quiz-option" data-correct="true">Svar B</div>
            <div class="quiz-option" data-correct="false">Svar C</div>

            <button onclick="checkQuiz(1)">Kontrollera</button>
        </div>

    </div>

    <!-- MODUL 2 -->
    <div class="module hidden" id="module2">

        <h2>Modul 2</h2>

        <video width="100%" controls>
            <source src="video/modul2.mp4" type="video/mp4">
        </video>

        <p>Fortsättning.</p>

    </div>

</main>

<script>

let scores = {};

function checkQuiz(module) {

    const quiz = document.querySelector(`.quiz[data-module='${module}']`);
    const options = quiz.querySelectorAll(".quiz-option");

    let correctCount = 0;
    let total = options.length;

    options.forEach(opt => {

        opt.classList.remove("correct","wrong");

        if (opt.classList.contains("selected")) {

            if (opt.dataset.correct === "true") {
                opt.classList.add("correct");
                correctCount++;
            } else {
                opt.classList.add("wrong");
            }

        }

    });

    let percent = (correctCount / 1) * 100;

    scores[module] = percent;

    if (percent >= 80) {
        unlockNext(module);
    }

}

document.querySelectorAll(".quiz-option").forEach(opt => {

    opt.addEventListener("click", function () {

        const parent = this.parentElement;

        parent.querySelectorAll(".quiz-option").forEach(o => {
            o.classList.remove("selected","correct","wrong");
        });

        this.classList.add("selected");

    });

});

function unlockNext(module) {

    const next = document.getElementById("module" + (module + 1));

    if (next) {
        next.classList.remove("hidden");
    }

}

</script>

</body>
</html>
