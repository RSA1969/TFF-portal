<body>

<h2 id="question"></h2>
<div id="options"></div>

<button onclick="next()">Next</button>

<script>
const course = courses[0];
const module = course.modules[0];

let i=0;
let score=0;

function show(){
const q = module.questions[i];

document.getElementById("question").innerText =
`Fråga ${i+1}: ` + q.q;

document.getElementById("options").innerHTML =
q.options.map((o,index)=>`
<div class="option" onclick="answer(${index}, this)">${o}</div>
`).join("");
}

function answer(index, el){
if(index==module.questions[i].correct){
score++;
el.classList.add("correct");
}else{
el.classList.add("wrong");
}
}

function next(){
i++;
if(i<module.questions.length){
show();
}else{
document.body.innerHTML = `<h1>Resultat: ${score}/10</h1>`;
}
}

show();
</script>
