<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
</head>
<body>

<h1>Modul</h1>

<video id="video" width="600" controls></video>

<div id="quiz">
  <h2 id="question"></h2>
  <div id="options"></div>
</div>

<script src="assets/js/kurser-data.js"></script>

<script>
const courseId = localStorage.getItem("selectedCourse");
const moduleId = localStorage.getItem("selectedModule");

const course = kurserData.find(c => c.id === courseId);
const module = course.modules.find(m => m.id === moduleId);

// VIDEO
document.getElementById("video").src = module.video;

// QUIZ
let index = 0;
let score = 0;

function loadQuestion() {
  const q = module.questions[index];

  document.getElementById("question").innerText = q.q;

  const optDiv = document.getElementById("options");
  optDiv.innerHTML = "";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.innerText = opt;

    btn.onclick = () => {
      if (i === q.correct) score++;
      next();
    };

    optDiv.appendChild(btn);
  });
}

function next() {
  index++;

  if (index < module.questions.length) {
    loadQuestion();
  } else {
    document.getElementById("quiz").innerHTML =
      `<h2>Resultat: ${score}/${module.questions.length}</h2>`;
  }
}

loadQuestion();
</script>

</body>
</html>
``
