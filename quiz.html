<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz – TFF Portal</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <a class="brand" href="index.html">TFF Digitala Kurser</a>
      <nav class="topnav">
        <a href="index.html">Start</a>
        <a href="utbildningar.html">Utbildningar</a>
        <a href="guides.html">Guider</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <section class="hero hero--small">
      <div class="hero__content">
        <p class="eyebrow">Kunskapstest</p>
        <h1 id="quizTitle">Quiz</h1>
        <p>Svara på alla frågor och skicka in resultatet.</p>
      </div>
    </section>

    <section class="section">
      <form id="quizForm" class="quiz-form"></form>

      <div class="actions-row">
        <button id="submitQuizBtn" class="btn btn-primary" type="button">Skicka quiz</button>
        <a class="btn btn-secondary" href="kurser.html">Tillbaka till kurs</a>
      </div>

      <div id="quizResult" class="content-card" style="display:none; margin-top: 24px;"></div>
    </section>
  </main>

  <script src="assets/js/kurser-data.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const courseId = localStorage.getItem("selectedCourseId");
      const moduleId = localStorage.getItem("selectedModuleId");

      const course = PortalData.getCourse(courseId);
      const module = PortalData.getModule(courseId, moduleId);

      const quizTitle = document.getElementById("quizTitle");
      const quizForm = document.getElementById("quizForm");
      const resultBox = document.getElementById("quizResult");

      if (!course || !module) {
        quizTitle.textContent = "Ingen quiz vald";
        quizForm.innerHTML = "<p>Ingen modul är vald.</p>";
        return;
      }

      quizTitle.textContent = `${course.title} – ${module.title}`;

      module.questions.forEach((question, qIndex) => {
        const block = document.createElement("section");
        block.className = "quiz-question";
        block.innerHTML = `<h3>${qIndex + 1}. ${question.q}</h3>`;

        question.options.forEach((option, oIndex) => {
          const label = document.createElement("label");
          label.className = "quiz-option";
          label.innerHTML = `
            <input type="radio" name="q${qIndex}" value="${oIndex}">
            <span>${option}</span>
          `;
          block.appendChild(label);
        });

        quizForm.appendChild(block);
      });

      document.getElementById("submitQuizBtn").addEventListener("click", function () {
        let score = 0;
        const total = module.questions.length;

        module.questions.forEach((question, qIndex) => {
          const selected = quizForm.querySelector(`input[name="q${qIndex}"]:checked`);
          if (selected && Number(selected.value) === question.correct) {
            score++;
          }
        });

        const passed = total > 0 ? score >= Math.ceil(total * 0.8) : false;

        PortalData.setModuleProgress(courseId, moduleId, {
          completed: true,
          quizPassed: passed,
          score,
          total
        });

        PortalData.saveResult({
          courseId: Number(courseId),
          moduleId: Number(moduleId),
          courseTitle: course.title,
          moduleTitle: module.title,
          score,
          total,
          passed,
          createdAt: new Date().toISOString()
        });

        resultBox.style.display = "block";
        resultBox.innerHTML = `
          <h2>Resultat</h2>
          <p><strong>Poäng:</strong> ${score} / ${total}</p>
          <p><strong>Status:</strong> ${passed ? "Godkänd" : "Inte godkänd"}</p>
          <div class="actions-row" style="margin-top:16px;">
            <a class="btn btn-primary" href="kurser.html">Tillbaka till kurs</a>
            <a class="btn btn-secondary" href="utbildningar.html">Till utbildningar</a>
          </div>
        `;
      });
    });
  </script>
</body>
</html>
